[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homestocker-agent"
version = "0.1.0"
description = "HomeStocker AI 对话助手 Agent 服务（LangChain + LangGraph）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3,<1.0",
    "langchain-openai>=0.3,<1.0",
    "langgraph>=0.6,<1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["homestocker_agent"]
