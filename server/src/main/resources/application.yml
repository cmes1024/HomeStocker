spring:
  application:
    name: homestocker-server
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://localhost:5432/homestocker
    username: homestocker
    password: homestocker
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

homestocker:
  wechat:
    # Fill via env / application-local override; never commit secrets.
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
  session:
    header: X-HS-Token
    ttl-days: 30
  storage:
    # local = MinIO; later cos/oss
    provider: minio
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: homestocker
  expire-notify:
    tmpl-id: ${EXPIRE_SUBSCRIBE_TMPL_ID:_oheW_DGsoqUxKsFIQrWSYIuoo4stYvsJv-JNf_uAiQ}
    cron: "0 0 8 * * *"
  admin:
    openid: ${ADMIN_OPENID:}
