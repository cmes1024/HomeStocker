spring:
  application:
    name: homestocker-server
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://localhost:5432/homestocker
    username: homestocker
    password: homestocker
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  tomcat:
    # 小程序经 /api/storage/upload 传压缩图
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

homestocker:
  wechat:
    # Fill via env / application-local override; never commit secrets.
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    # Local only: login body { "code": "dev-openid-1" } (or mock:dev-openid-1). Never in prod.
    mock-enabled: ${WECHAT_MOCK_ENABLED:false}
  session:
    header: X-HS-Token
    ttl-days: 30
  cors:
    allowed-origin-patterns:
      - "*"
  storage:
    # local = MinIO; later cos/oss
    provider: minio
    endpoint: http://localhost:9000
    # Client-facing base (DevTools / 真机). Empty = same as endpoint.
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
    access-key: minioadmin
    secret-key: minioadmin
    bucket: homestocker
  expire-notify:
    tmpl-id: ${EXPIRE_SUBSCRIBE_TMPL_ID:_oheW_DGsoqUxKsFIQrWSYIuoo4stYvsJv-JNf_uAiQ}
    cron: "0 0 8 * * *"
  admin:
    # Comma-separated WeChat openids allowed to issue capacity redeem codes.
    openids: ${ADMIN_OPENIDS:${ADMIN_OPENID:}}
  ai:
    act-rate-per-minute: ${AI_ACT_RATE_PER_MINUTE:30}
