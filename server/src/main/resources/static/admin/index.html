<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>HomeStocker · 数据看板</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --line: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
    --faint: #9ca3af;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --ok: #059669;
    --warn: #d97706;
    --bad: #dc2626;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px -16px rgba(16, 24, 40, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --line: #262b35;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --faint: #6b7280;
      --accent: #818cf8;
      --accent-soft: #1e2030;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -20px rgba(0,0,0,.8);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px 64px; }

  header.topbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1180px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .brand .sub { font-size: 12px; color: var(--faint); }
  .spacer { flex: 1 1 auto; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--bad); }
  .dot.loading { background: var(--warn); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  button {
    font: inherit; font-size: 13px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    padding: 7px 13px; border-radius: 9px; transition: .15s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.06); color: #fff; }

  section { margin-top: 20px; }
  .cards {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
    margin-top: 20px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow);
  }
  .card .k { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .card .v {
    font-size: 26px; font-weight: 640; letter-spacing: -.02em; margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .card .v small { font-size: 12px; font-weight: 500; color: var(--faint); margin-left: 4px; }
  .card .hint {
    font-size: 11.5px; color: var(--faint); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .grid2 { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px 18px 18px; box-shadow: var(--shadow);
  }
  .panel h2 {
    font-size: 13px; font-weight: 600; color: var(--muted);
    margin: 0 0 14px; letter-spacing: .02em;
  }

  /* 漏斗 */
  .funnel-row { margin-bottom: 14px; }
  .funnel-row:last-child { margin-bottom: 0; }
  .funnel-head { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 6px; }
  .funnel-head b { font-variant-numeric: tabular-nums; }
  .track { height: 10px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width .5s ease; }

  /* 家庭表 */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-weight: 500; color: var(--faint); font-size: 11.5px;
    padding: 0 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  td { padding: 9px 8px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.num { text-align: right; }
  .fam-name { font-weight: 500; }
  .badge {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); margin-left: 6px;
  }
  .badge.ok { background: rgba(16, 185, 129, .14); color: #059669; }
  .badge.warn { background: rgba(245, 158, 11, .16); color: #b45309; }
  .badge.muted { background: var(--line); color: var(--muted); }
  .empty { color: var(--faint); font-size: 13px; padding: 10px 0; }

  /* 图表 */
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis { fill: var(--faint); font-size: 10px; }
  .grid-line { stroke: var(--line); stroke-width: 1; }

  .notes ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
  .notes li { margin-bottom: 4px; }

  /* 令牌闸门 */
  .gate {
    position: fixed; inset: 0; z-index: 50;
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .gate.show { display: flex; }
  .gate-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 24px; width: min(420px, 100%); box-shadow: var(--shadow);
  }
  .gate-box h3 { margin: 0 0 6px; font-size: 16px; }
  .gate-box p { margin: 0 0 16px; color: var(--muted); font-size: 12.5px; }
  .gate-box input {
    width: 100%; padding: 9px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 9px; margin-bottom: 12px;
  }
  .gate-box input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .gate-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .err-msg { color: var(--bad); font-size: 12.5px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>HomeStocker</h1>
      <span class="sub">数据看板</span>
    </div>
    <div class="spacer"></div>
    <div class="status" id="status"><span class="dot"></span><span id="status-text">未加载</span></div>
    <button id="btn-refresh">刷新</button>
    <button id="btn-token">令牌</button>
  </div>
</header>

<div class="wrap">
  <section class="cards" id="cards"></section>

  <section class="grid2">
    <div class="panel">
      <h2>注册 → 进家庭</h2>
      <div id="funnel"></div>
    </div>
    <div class="panel">
      <h2>家庭健康</h2>
      <div id="health"></div>
    </div>
  </section>

  <section>
    <div class="panel">
      <h2>近 30 天</h2>
      <div class="legend">
        <span><i style="background:#4f46e5"></i>新增物资</span>
        <span><i style="background:#0ea5e9"></i>新成员</span>
        <span><i style="background:#f59e0b"></i>活跃用户</span>
      </div>
      <div id="trend"></div>
    </div>
  </section>

  <section>
    <div class="panel">
      <h2>家庭</h2>
      <div id="families"></div>
    </div>
  </section>

  <section>
    <div class="panel notes">
      <h2>口径说明</h2>
      <ul id="notes"><li>等待数据…</li></ul>
    </div>
  </section>
</div>

<div class="gate" id="gate">
  <div class="gate-box">
    <h3>看板访问令牌</h3>
    <p>与服务端 <code>ADMIN_DASHBOARD_TOKEN</code> 保持一致。仅保存在本机浏览器。</p>
    <input id="gate-input" type="password" placeholder="粘贴令牌" autocomplete="off">
    <div class="err-msg" id="gate-err"></div>
    <div class="gate-actions">
      <button id="gate-cancel">取消</button>
      <button class="primary" id="gate-save">保存并加载</button>
    </div>
  </div>
</div>

<script>
(function () {
  const TOKEN_KEY = 'hs_dashboard_token';
  const $ = (id) => document.getElementById(id);
  let token = '';
  try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { token = ''; }

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
  const num = (v) => (v == null ? '—' : Number(v).toLocaleString('zh-CN'));
  const pct = (a, b) => (b > 0 ? Math.round((a / b) * 100) : 0);

  function setStatus(kind, text) {
    const dot = document.querySelector('#status .dot');
    dot.className = 'dot ' + (kind || '');
    $('status-text').textContent = text;
  }

  function fmtTime(ms) {
    if (!ms) return '—';
    const d = new Date(ms);
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
           ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function fmtRelative(ms) {
    if (!ms) return '从未';
    const diff = Date.now() - ms;
    if (diff < 0) return '刚刚';
    const min = Math.floor(diff / 60000);
    if (min < 1) return '刚刚';
    if (min < 60) return min + ' 分钟前';
    const h = Math.floor(min / 60);
    if (h < 24) return h + ' 小时前';
    const d = Math.floor(h / 24);
    if (d < 30) return d + ' 天前';
    return fmtTime(ms);
  }

  function renderCards(ov) {
    const cards = [
      { k: '注册用户', v: ov.users, hint: 'openid 去重' },
      { k: '已进家庭', v: ov.inFamily, hint: '进家率 ' + pct(ov.inFamily, ov.users) + '%' },
      { k: '无家庭', v: ov.noFamily, hint: '未建 / 未加入' },
      { k: '近 7 天登录', v: ov.active7d, hint: '按 updated_at' },
      { k: '活跃家庭', v: ov.activeFamilies, hint: '近 7 天有操作' },
      { k: '空壳家庭', v: ov.emptyFamilies, hint: '共 ' + num(ov.families) + ' 个家庭' },
      { k: '物资', v: ov.items, hint: '7 天内过期 ' + num(ov.expiringSoon) + ' 件' },
      { k: '多家庭成员', v: ov.multiFamilyUsers, hint: '≥ 2 个家庭的人' }
    ];
    $('cards').innerHTML = cards.map((c) =>
      '<div class="card"><div class="k">' + esc(c.k) + '</div>' +
      '<div class="v">' + num(c.v) + '</div>' +
      '<div class="hint">' + esc(c.hint) + '</div></div>'
    ).join('');
  }

  function renderFunnel(ov) {
    const base = Math.max(1, ov.users);
    const rows = [
      { label: '注册用户', value: ov.users },
      { label: '进入家庭', value: ov.inFamily }
    ];
    $('funnel').innerHTML = rows.map((r) =>
      '<div class="funnel-row">' +
        '<div class="funnel-head"><span>' + esc(r.label) + '</span>' +
        '<b>' + num(r.value) + ' · ' + pct(r.value, base) + '%</b></div>' +
        '<div class="track"><div class="fill" style="width:' +
          Math.max(1, Math.round((r.value / base) * 100)) + '%"></div></div>' +
      '</div>'
    ).join('') +
      '<div class="hint" style="margin-top:14px">差值 <b>' + num(ov.noFamily) +
      '</b> 人登录后既没建家也没加入家庭，占 ' + pct(ov.noFamily, base) + '%</div>';
  }

  function renderHealth(h) {
    const sum = (h.active || 0) + (h.silent || 0) + (h.empty || 0);
    const base = Math.max(1, sum);
    const rows = [
      { label: '活跃', value: h.active || 0, color: '#10b981', desc: '近 7 天有操作' },
      { label: '沉默', value: h.silent || 0, color: '#f59e0b', desc: '有物资但 7 天没动' },
      { label: '空壳', value: h.empty || 0, color: '#9ca3af', desc: '0 物资' }
    ];
    $('health').innerHTML =
      '<div class="funnel-head" style="margin-bottom:10px"><span>家庭总数</span><b>' + num(sum) + '</b></div>' +
      rows.map((r) =>
        '<div class="funnel-row">' +
          '<div class="funnel-head"><span>' + esc(r.label) +
            ' <span style="color:var(--faint)">· ' + esc(r.desc) + '</span></span>' +
          '<b>' + num(r.value) + '</b></div>' +
          '<div class="track"><div class="fill" style="width:' +
            (r.value === 0 ? 0 : Math.max(2, Math.round((r.value / base) * 100))) +
            '%;background:' + r.color + '"></div></div>' +
        '</div>'
      ).join('') +
      '<div class="hint" style="margin-top:14px">已订阅过期提醒的物资 <b>' +
      num(h.subscribedItems) + '</b> 件</div>';
  }

  function renderTrend(data) {
    if (!data || !data.length) { $('trend').innerHTML = '<div class="empty">暂无数据</div>'; return; }
    const W = 720, H = 210, P = { l: 30, r: 14, t: 12, b: 26 };
    const series = [
      { key: 'items', color: '#4f46e5' },
      { key: 'members', color: '#0ea5e9' },
      { key: 'activeUsers', color: '#f59e0b' }
    ];
    const max = Math.max(1, ...data.flatMap((d) => series.map((s) => d[s.key] || 0)));
    const x = (i) => P.l + (W - P.l - P.r) * (data.length <= 1 ? 0 : i / (data.length - 1));
    const y = (v) => P.t + (H - P.t - P.b) * (1 - v / max);

    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="近 30 天趋势">';
    for (let g = 0; g <= 4; g++) {
      const gy = P.t + (H - P.t - P.b) * (g / 4);
      const val = Math.round(max * (1 - g / 4));
      svg += '<line class="grid-line" x1="' + P.l + '" y1="' + gy + '" x2="' + (W - P.r) + '" y2="' + gy + '"/>';
      svg += '<text class="axis" x="' + (P.l - 6) + '" y="' + (gy + 3) + '" text-anchor="end">' + val + '</text>';
    }
    data.forEach((d, i) => {
      if (i % 5 !== 0 && i !== data.length - 1) return;
      svg += '<text class="axis" x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(d.label) + '</text>';
    });
    series.forEach((s) => {
      const pts = data.map((d, i) => x(i) + ',' + y(d[s.key] || 0));
      svg += '<polyline fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round" ' +
             'stroke-linecap="round" points="' + pts.join(' ') + '"/>';
      data.forEach((d, i) => {
        if (!d[s.key]) return;
        svg += '<circle cx="' + x(i) + '" cy="' + y(d[s.key]) + '" r="2.4" fill="' + s.color + '"/>';
      });
    });
    svg += '</svg>';
    $('trend').innerHTML = svg;
  }

  const STATUS = {
    active: { text: '活跃', cls: 'ok' },
    silent: { text: '沉默', cls: 'warn' },
    empty: { text: '空壳', cls: 'muted' }
  };

  function fmtDate(ms) {
    if (!ms) return '—';
    const d = new Date(ms);
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function renderFamilies(list) {
    if (!list || !list.length) { $('families').innerHTML = '<div class="empty">还没有家庭</div>'; return; }
    const rows = list.map((f) => {
      const st = STATUS[f.status] || STATUS.empty;
      return '<tr>' +
        '<td class="fam-name">' + esc(f.name) +
          '<span class="badge ' + st.cls + '">' + st.text + '</span></td>' +
        '<td class="num">' + num(f.members) + '</td>' +
        '<td class="num">' + num(f.items) + '</td>' +
        '<td>' + esc(fmtDate(f.created)) + '</td>' +
        '<td title="' + esc(fmtTime(f.lastActivity)) + '">' + esc(fmtRelative(f.lastActivity)) + '</td>' +
      '</tr>';
    }).join('');
    $('families').innerHTML =
      '<table><thead><tr><th>名称</th><th class="num">成员</th><th class="num">物资</th>' +
      '<th>创建</th><th>最近操作</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>';
  }

  function render(data) {
    renderCards(data.overview);
    renderFunnel(data.overview);
    renderHealth(data.health);
    renderTrend(data.trend);
    renderFamilies(data.families);
    $('notes').innerHTML = (data.notes || []).map((n) => '<li>' + esc(n) + '</li>').join('') +
      '<li>数据生成于 ' + esc(fmtTime(data.generatedAt)) + '</li>';
  }

  async function load() {
    if (!token) { openGate(); return; }
    setStatus('loading', '加载中…');
    try {
      const res = await fetch('/admin/api/overview', {
        headers: { 'Authorization': 'Bearer ' + token },
        cache: 'no-store'
      });
      const json = await res.json().catch(() => null);
      if (!res.ok || !json || !json.ok) {
        const msg = (json && json.error && json.error.message) || ('HTTP ' + res.status);
        if (res.status === 401 || res.status === 503) { openGate(msg); }
        setStatus('err', msg);
        return;
      }
      render(json.data);
      setStatus('ok', '已更新 · ' + fmtTime(json.data.generatedAt));
    } catch (e) {
      setStatus('err', '请求失败：' + e.message);
    }
  }

  function openGate(msg) {
    $('gate').classList.add('show');
    $('gate-err').textContent = msg || '';
    $('gate-input').value = '';
    setTimeout(() => $('gate-input').focus(), 30);
  }
  function closeGate() { $('gate').classList.remove('show'); }

  $('gate-save').addEventListener('click', () => {
    const v = $('gate-input').value.trim();
    if (!v) { $('gate-err').textContent = '令牌不能为空'; return; }
    token = v;
    try { localStorage.setItem(TOKEN_KEY, token); } catch (e) { /* 忽略隐私模式写入失败 */ }
    closeGate();
    load();
  });
  $('gate-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('gate-save').click();
  });
  $('gate-cancel').addEventListener('click', closeGate);
  $('btn-refresh').addEventListener('click', load);
  $('btn-token').addEventListener('click', () => openGate(''));

  load();
})();
</script>
</body>
</html>
