# HomeStocker local / single-host stack.
# Prerequisite on the machine: Docker only (Desktop or compatible engine).
# Usage:
#   cd server && docker compose up --build
#   curl http://localhost:8080/api/health
#
# Optional secrets: copy .env.example → .env (WECHAT_APP_ID / WECHAT_APP_SECRET).

services:
  postgres:
    image: postgres:16-alpine
    container_name: hs-postgres
    environment:
      POSTGRES_DB: homestocker
      POSTGRES_USER: homestocker
      POSTGRES_PASSWORD: homestocker
    ports:
      - "5432:5432"
    volumes:
      - hs_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homestocker -d homestocker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hs-redis
    ports:
      - "6379:6379"
    volumes:
      - hs_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: hs-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - hs_minio_data:/data
    # Official image is minimal; no curl-based healthcheck.

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hs-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      ADMIN_OPENID: ${ADMIN_OPENID:-}
      EXPIRE_SUBSCRIBE_TMPL_ID: ${EXPIRE_SUBSCRIBE_TMPL_ID:-_oheW_DGsoqUxKsFIQrWSYIuoo4stYvsJv-JNf_uAiQ}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  hs_pg_data:
  hs_redis_data:
  hs_minio_data:
