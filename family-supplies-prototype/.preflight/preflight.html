<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
:root {
  --family-background: #f6f8f6;
  --family-foreground: #18211d;
  --family-card: #ffffff;
  --family-card-foreground: #18211d;
  --family-popover: #ffffff;
  --family-popover-foreground: #18211d;
  --family-primary: #2f7d62;
  --family-primary-foreground: #f8fffb;
  --family-muted: #e8efeb;
  --family-muted-foreground: #60716a;
  --family-border: #d6dfda;
  --family-input: #d6dfda;
  --family-ring: #2f7d62;

  --family-bg: var(--family-background);
  --family-surface: var(--family-card);
  --family-surface-2: #eef5f1;
  --family-ink: var(--family-foreground);
  --family-ink-2: #5f6f68;
  --family-ink-3: #889790;
  --family-line: var(--family-border);
  --family-brand: var(--family-primary);
  --family-brand-ink: var(--family-primary-foreground);

  --family-state-success: #2f7d62;
  --family-state-warning: #c68a24;
  --family-state-error: #c9574b;
  --family-state-info: #5380c1;

  --family-radius-sm: 8px;
  --family-radius-md: 16px;
  --family-radius-lg: 24px;
  --family-shadow-soft: 0 12px 28px rgba(24, 33, 29, 0.05);
  --family-shadow-float: 0 16px 32px rgba(24, 33, 29, 0.08);

  --family-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--family-background);
  color: var(--family-foreground);
  font-family: var(--family-font-sans);
}

body {
  min-height: 100vh;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--family-background);
    --color-foreground: var(--family-foreground);
    --color-card: var(--family-card);
    --color-card-foreground: var(--family-card-foreground);
    --color-popover: var(--family-popover);
    --color-popover-foreground: var(--family-popover-foreground);
    --color-primary: var(--family-primary);
    --color-primary-foreground: var(--family-primary-foreground);
    --color-muted: var(--family-muted);
    --color-muted-foreground: var(--family-muted-foreground);
    --color-border: var(--family-border);
    --color-input: var(--family-input);
    --color-ring: var(--family-ring);
    --radius-sm: var(--family-radius-sm);
    --radius-md: var(--family-radius-md);
    --radius-lg: var(--family-radius-lg);
  }
  @layer base {
    body { background: var(--family-background); color: var(--family-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--family-background); }
      .text-background { color: var(--family-background); }
      .border-background { border-color: var(--family-background); }
      .ring-background { --tw-ring-color: var(--family-background); }
      .bg-foreground { background-color: var(--family-foreground); }
      .text-foreground { color: var(--family-foreground); }
      .border-foreground { border-color: var(--family-foreground); }
      .ring-foreground { --tw-ring-color: var(--family-foreground); }
      .bg-card { background-color: var(--family-card); }
      .text-card { color: var(--family-card); }
      .border-card { border-color: var(--family-card); }
      .ring-card { --tw-ring-color: var(--family-card); }
      .bg-card-foreground { background-color: var(--family-card-foreground); }
      .text-card-foreground { color: var(--family-card-foreground); }
      .border-card-foreground { border-color: var(--family-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--family-card-foreground); }
      .bg-popover { background-color: var(--family-popover); }
      .text-popover { color: var(--family-popover); }
      .border-popover { border-color: var(--family-popover); }
      .ring-popover { --tw-ring-color: var(--family-popover); }
      .bg-popover-foreground { background-color: var(--family-popover-foreground); }
      .text-popover-foreground { color: var(--family-popover-foreground); }
      .border-popover-foreground { border-color: var(--family-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--family-popover-foreground); }
      .bg-primary { background-color: var(--family-primary); }
      .text-primary { color: var(--family-primary); }
      .border-primary { border-color: var(--family-primary); }
      .ring-primary { --tw-ring-color: var(--family-primary); }
      .bg-primary-foreground { background-color: var(--family-primary-foreground); }
      .text-primary-foreground { color: var(--family-primary-foreground); }
      .border-primary-foreground { border-color: var(--family-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--family-primary-foreground); }
      .bg-muted { background-color: var(--family-muted); }
      .text-muted { color: var(--family-muted); }
      .border-muted { border-color: var(--family-muted); }
      .ring-muted { --tw-ring-color: var(--family-muted); }
      .bg-muted-foreground { background-color: var(--family-muted-foreground); }
      .text-muted-foreground { color: var(--family-muted-foreground); }
      .border-muted-foreground { border-color: var(--family-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--family-muted-foreground); }
      .bg-border { background-color: var(--family-border); }
      .text-border { color: var(--family-border); }
      .border-border { border-color: var(--family-border); }
      .ring-border { --tw-ring-color: var(--family-border); }
      .bg-input { background-color: var(--family-input); }
      .text-input { color: var(--family-input); }
      .border-input { border-color: var(--family-input); }
      .ring-input { --tw-ring-color: var(--family-input); }
      .bg-ring { background-color: var(--family-ring); }
      .text-ring { color: var(--family-ring); }
      .border-ring { border-color: var(--family-ring); }
      .ring-ring { --tw-ring-color: var(--family-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">

</body>
</html>
