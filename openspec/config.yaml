schema: spec-driven

context: |
  HomeStocker：微信原生小程序 + 云开发文档库（不做 MySQL / ES）。
  第一阶段现状：docs/plans/2026-09-17-phase1-status.md ；文档地图：docs/README.md。
  身份只用云函数 OPENID + memberships；物资/空间/标签/活动独立集合；写路径走云函数。
  页面、AI 录入、未来对话同一套 item/family/space/tag 写入口。packageAi 是录入向导不是对话。
  进行中 change 应先读现状快照；角色权限、软删除、对话半屏、实景 3D 不进当前阶段。

